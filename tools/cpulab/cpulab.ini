; MasterSword CPU Lab rules (cpulab watch). ";" or "#" start a note.
; Your own whitelist: the target, what the whole process gets, and per-thread rules by thread name (the first that matches wins).
; Run "cpulab threads" while the game runs to see its threads' names.
;
; cores:   P | E | all | list:0,1,10-13 | mask:0x403 | Pminus:23 (the P-cores less those)
; method:  affinity (hard: only those cores) | cpuset (Windows CPU Sets: a strong preference, what Windows' own game tuning uses)
; priority: idle lowest below_normal normal above_normal highest time_critical keep
; power_throttling: off (no EcoQoS: full speed) | on | keep
;
; MasterSword already places its threads itself. To start from a clean slate, put these in hookshot_env.txt first:
;   HOS_P_CORES=0  HOS_GAME_P_CORES=0  RX_VK_PAR_ANY_CORE=1  RX_VK_JOBS_ANY_CORE=1  RX_VK_REPLAY_PIN=0
; This file as it is reproduces the layout the game uses now (270K Plus: P-cores 0,1,10-13,22,23; core 23 kept for rendering).

[target]
exe=mastersword.exe
interval_ms=2000

[process]
priority=keep
power_throttling=off

; the renderer's recording threads: the P-cores less the one kept for the frame's main recording
[rule]
match=replay worker
cores=Pminus:23
method=affinity
priority=above_normal
power_throttling=off

; the renderer's shader translation and pipeline builds: background work, on the E-cores
[rule]
match=mkw_vk worker
cores=E
method=affinity
priority=below_normal

; OoT's object walker: lowest priority, anywhere
[rule]
match=OptimizeChange
cores=all
priority=lowest

; the frame's own threads
[rule]
match=Presentation
cores=Pminus:23
method=affinity
power_throttling=off

[rule]
match=MainThread
cores=Pminus:23
method=affinity
power_throttling=off

; audio: steady, not heavy
[rule]
match=Audio
cores=P
method=cpuset
power_throttling=off

; threads with no name: mostly the graphics driver's and Windows' own. Left alone (an empty "match=" is the unnamed ones).
; Give this rule cores=... to experiment with them too.
[rule]
match=

; every other thread (the game's own: six of them run at a time)
[rule]
match=*
cores=Pminus:23
method=affinity

; ---- ideas to try (copy over the rules above) ----
; * The softer way: method=cpuset everywhere. Windows prefers those cores but may still move a thread when they are all busy.
; * Mirror the Switch 2 more strictly: the game's threads on 6 P-cores only (cores=list:0,1,10-13), 22 and 23 for the renderer.
; * Cache neighbours: on a 270K Plus each P-core has its own L2, the E-cores share one L2 per four. "cpulab topo" shows which.
